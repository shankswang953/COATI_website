name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Read COATI revision
        id: package
        run: echo "ref=$(cat package-ref.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out COATI package
        uses: actions/checkout@v4
        with:
          repository: shankswang953/COATI
          ref: ${{ steps.package.outputs.ref }}
          path: _package
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and website dependencies
        run: python -m pip install ./_package -r requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build website from saved outputs
        run: python scripts/build_website.py --package-root _package
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v4
